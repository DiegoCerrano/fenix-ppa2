[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fenix"
version = "1.0.0"
description = "Proyecto Fenix: webhook, SQS, worker, Boto3 y aviso"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fenix = "fenix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
